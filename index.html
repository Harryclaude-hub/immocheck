<style>
:root{
  --brand:#1d4ed8; --brand-2:#3b82f6; --brand-soft:#eff6ff; --brand-dark:#1e3a8a;
  --accent:#dc2626; --accent-2:#ef4444; --accent-soft:#fef2f2;
  --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f6f8fc; --surface:#fff;
  --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --info:#2563eb;
  --r:14px; --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(29,78,216,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25}
h1{font-size:1.5rem;letter-spacing:-.02em}
h2{font-size:1.15rem;letter-spacing:-.01em}
h3{font-size:1rem}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(20,184,166,.15)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:0 0 5px}
.hidden{display:none !important}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;background:var(--brand);color:#fff;padding:11px 16px;border-radius:11px;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn.sec{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost{background:transparent;color:var(--muted);border-color:transparent;padding:8px 10px}
.btn.danger{background:var(--bad)}
.btn.sm{padding:7px 11px;font-size:.85rem;border-radius:9px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

/* Layout */
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.topbar{background:#fff;color:var(--ink);padding:13px 0;position:sticky;top:0;z-index:40;border-bottom:1px solid var(--line);box-shadow:0 1px 10px rgba(15,23,42,.05)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--brand) 0%,var(--brand-2) 55%,var(--accent) 55%,var(--accent-2) 100%)}
.topbar .wrap{display:flex;align-items:center;gap:12px}
.logo{font-weight:800;letter-spacing:-.03em;font-size:1.1rem;display:flex;align-items:center;gap:9px;color:var(--brand-dark)}
.logo .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:.95rem;box-shadow:0 2px 8px rgba(29,78,216,.3)}
.logo em{font-style:normal;color:var(--accent)}
.spacer{flex:1}
.userchip{display:flex;align-items:center;gap:8px;background:var(--brand-soft);color:var(--brand-dark);padding:5px 11px 5px 5px;border-radius:999px;font-size:.82rem;font-weight:600;cursor:pointer;border:1px solid #dbeafe}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.72rem}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:55px;z-index:30;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav.tabs .wrap{display:flex;gap:4px}
nav.tabs button{background:none;border:none;padding:13px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}
main{padding:20px 0 60px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card.tight{padding:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.g2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}

/* Mehrfachauswahl als antippbare Kästchen */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;
  background:#fff;font-size:.83rem;font-weight:600;color:var(--muted);cursor:pointer;transition:.13s;user-select:none;min-height:38px}
.chip input{width:auto;margin:0;accent-color:var(--brand)}
.chip:has(input:checked){background:var(--brand-soft);border-color:var(--brand-2);color:var(--brand-dark)}
.chip:active{transform:scale(.97)}
/* Eingescannte Papierbögen */
.scan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scan{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
.scan img{width:100%;height:190px;object-fit:cover;display:block;cursor:zoom-in}
.bogen-nr{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;
  background:var(--brand-soft);color:var(--brand-dark);font-size:.72rem;font-weight:800;vertical-align:middle}
/* Laufendes Diktat */
.btn.aufnahme{background:var(--bad);color:#fff;border-color:transparent;animation:pulsieren 1.5s ease-in-out infinite}
@keyframes pulsieren{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}50%{box-shadow:0 0 0 9px rgba(220,38,38,0)}}
.substep{border-left:3px solid var(--brand-soft);padding-left:12px;margin:14px 0}
.substep>h4{font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--brand);margin:0 0 8px}

/* Stats */
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stat .n{font-size:1.7rem;font-weight:800;letter-spacing:-.03em}
.stat .l{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:700;background:#f1f5f9;color:var(--muted)}
.badge.ok{background:#dcfce7;color:#15803d}
.badge.warn{background:#fef3c7;color:#b45309}
.badge.bad{background:#fee2e2;color:#b91c1c}
.badge.info{background:#dbeafe;color:#1d4ed8}
.badge.brand{background:var(--brand-soft);color:var(--brand)}

/* Listen */
.list-item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.list-item:hover{border-color:var(--brand-2);transform:translateY(-1px)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.xs{font-size:.75rem}
.mono{font-variant-numeric:tabular-nums}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}

/* Auth */
.auth-wrap{min-height:100dvh;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 12% 18%, rgba(59,130,246,.16), transparent 42%),
    radial-gradient(circle at 88% 82%, rgba(220,38,38,.11), transparent 45%),
    linear-gradient(180deg,#fbfcff,#eef3fb)}
.auth-wrap::before{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(29,78,216,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(29,78,216,.055) 1px,transparent 1px);
  background-size:46px 46px}
.auth-card{width:100%;max-width:415px;background:#fff;border-radius:20px;padding:28px;position:relative;
  box-shadow:0 24px 70px rgba(29,78,216,.16),0 2px 8px rgba(15,23,42,.06);border:1px solid #e8eefb}
.auth-card::before{content:"";position:absolute;top:0;left:26px;right:26px;height:3px;border-radius:0 0 4px 4px;
  background:linear-gradient(90deg,var(--brand),var(--brand-2) 60%,var(--accent))}
.auth-card h1{text-align:center;color:var(--brand-dark)}
.auth-sub{text-align:center;color:var(--muted);font-size:.88rem;margin-bottom:20px}
.field{margin-bottom:13px}
.switcher{display:flex;background:var(--bg);border-radius:11px;padding:4px;margin-bottom:18px}
.switcher button{flex:1;background:none;border:none;padding:9px;border-radius:8px;font-weight:700;color:var(--muted)}
.switcher button.active{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.note{background:var(--brand-soft);border:1px solid #bfdbfe;color:var(--brand-dark);padding:10px 12px;border-radius:10px;font-size:.82rem;margin-bottom:14px}
.err{background:#fee2e2;border:1px solid #fecaca;color:#b91c1c;padding:10px 12px;border-radius:10px;font-size:.85rem;margin-bottom:12px}

/* Begehung */
.cat{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.cat-head{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;user-select:none}
.cat-head .ico{font-size:1.3rem}
.cat-head .t{font-weight:700;flex:1}
.cat-body{border-top:1px solid var(--line);display:none}
.cat.open .cat-body{display:block}
.crit{padding:14px;border-bottom:1px solid #f1f5f9}
.crit:last-child{border-bottom:none}
.crit-name{font-weight:600;margin-bottom:2px}
.crit-hint{font-size:.78rem;color:var(--muted);margin-bottom:9px}
.pres{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.pres button{flex:1;min-width:96px;padding:9px 6px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-weight:600;font-size:.82rem;color:var(--muted)}
.pres button.on[data-v="vorhanden"]{background:#dcfce7;border-color:#4ade80;color:#15803d}
.pres button.on[data-v="nicht_vorhanden"]{background:#fee2e2;border-color:#fca5a5;color:#b91c1c}
.pres button.on[data-v="nicht_relevant"]{background:#e2e8f0;border-color:#94a3b8;color:#475569}
.emojis{display:flex;gap:5px;margin-bottom:9px}
.emojis button{flex:1;padding:8px 2px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:1.35rem;line-height:1.1;transition:.12s}
.emojis button .lbl{display:block;font-size:.6rem;font-weight:700;color:var(--muted);margin-top:2px}
.emojis button.on{border-color:var(--brand);background:var(--brand-soft);transform:scale(1.05)}
.crit-extra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.chip-toggle{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-size:.8rem;font-weight:600;color:var(--muted)}
.chip-toggle.on{background:#fef3c7;border-color:#fbbf24;color:#b45309}
.thumb{width:54px;height:54px;border-radius:9px;object-fit:cover;border:1px solid var(--line)}
.progressbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progressbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px;transition:.3s}

/* Vorlagen-Auswahl */
.tpl-list{display:flex;flex-direction:column;gap:7px;margin-bottom:8px;max-height:340px;overflow:auto;padding:2px}
.tpl{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff;transition:.12s}
.tpl:hover{border-color:var(--brand-2)}
.tpl.on{border-color:var(--brand);background:var(--brand-soft)}
.tpl input{display:none}
.tpl .ico{font-size:1.35rem;line-height:1}
.tpl .txt{flex:1;min-width:0}
.tpl .txt small{display:block;color:var(--muted);font-size:.75rem;margin-top:2px;line-height:1.4}
.tpl .cnt{font-weight:800;color:var(--brand);font-size:.95rem;white-space:nowrap}
.tpl .cnt::after{content:" Punkte";font-size:.62rem;font-weight:600;color:var(--muted)}

/* Ausgeblendetes und ausgeschlossene Bereiche */
.cat.skipped{opacity:.72;background:#fafafa}
.cat.skipped .cat-head .t{text-decoration:line-through;text-decoration-color:#cbd5e1}
.skip-info{padding:12px 14px;background:#fffbeb;border-top:1px solid #fde68a;font-size:.84rem;color:#92400e}
.hidden-box{padding:10px 14px;background:#f8fafc;border-top:1px dashed var(--line)}
.hidden-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.8rem;color:var(--muted)}
.hidden-row .nm{flex:1;text-decoration:line-through}
.item-menu{position:relative}
.item-menu>button{background:none;border:none;color:var(--muted);font-size:1.1rem;padding:2px 7px;border-radius:8px;line-height:1}
.item-menu>button:hover{background:var(--bg);color:var(--ink)}
.menu-pop{position:absolute;right:0;top:26px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 30px rgba(15,23,42,.14);z-index:15;min-width:180px;overflow:hidden}
.menu-pop button{display:block;width:100%;text-align:left;background:none;border:none;padding:10px 13px;font-size:.85rem;color:var(--ink)}
.menu-pop button:hover{background:var(--brand-soft)}
.menu-pop button.warn{color:var(--bad)}

/* Sticky Footer Bar */
.stickybar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 0;margin-top:16px;z-index:20;box-shadow:0 -4px 20px rgba(15,23,42,.07)}
.stickybar .wrap{display:flex;gap:10px;align-items:center}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:16px;z-index:100;backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:88dvh;overflow:auto;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.modal h2{margin-bottom:14px}

/* Tabelle */
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 8px;border-bottom:1px solid #f1f5f9;vertical-align:middle}

/* Verlauf */
.trend{display:flex;gap:6px;align-items:flex-end;height:70px;padding:6px 0}
.trend .bar{flex:1;max-width:44px;background:linear-gradient(180deg,var(--brand-2),var(--brand));border-radius:6px 6px 0 0;position:relative;min-height:6px}
.trend .bar span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:.68rem;font-weight:700;color:var(--muted)}

/* Einheitenliste, funktioniert am Handy wie am Rechner */
.unit-list{display:flex;flex-direction:column;gap:8px}
.unit{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;box-shadow:var(--shadow)}
.unit .nr{width:34px;height:34px;flex:none;border-radius:9px;background:var(--brand-soft);color:var(--brand-dark);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.unit .txt{flex:1;min-width:0}
.unit .txt strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit .txt small{color:var(--muted);font-size:.75rem}
.unit .act{display:flex;gap:6px;flex:none}

/* Handy */
@media(max-width:560px){
  .hide-sm{display:none}
  .wrap{padding:0 12px}
  h1{font-size:1.3rem}
  /* Tabellen seitlich schiebbar statt gequetscht */
  table.t{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
  /* Daumenfreundliche Flächen */
  .btn{padding:12px 16px}
  .btn.sm{padding:10px 13px}
  input,select,textarea{font-size:16px}   /* verhindert das Zoomen beim Antippen in iOS */
  .modal{max-width:100%;max-height:94dvh;border-radius:16px 16px 0 0;padding:18px 16px}
  .modal-bg{place-items:end center;padding:0}
  .unit .act .btn{padding:10px 12px}
  .chip{padding:9px 13px;min-height:42px}
}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:.88rem;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw}
.loader{width:22px;height:22px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center-load{display:grid;place-items:center;padding:50px}
.center-load .loader{border-color:var(--line);border-top-color:var(--brand)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:2.4rem;margin-bottom:8px}
@media print{.topbar,nav.tabs,.stickybar{display:none}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="view-auth" class="auth-wrap">
  <div class="auth-card">
    <div style="text-align:center;margin-bottom:6px">
      <svg width="62" height="62" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M32 6 60 27v31a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V27L32 6Z" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round"/>
        <path d="M24 61V40h16v21" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="47" cy="20" r="12" fill="#dc2626"/>
        <path d="m41.5 20 3.8 4 7.2-7.6" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Immo<em style="font-style:normal;color:#dc2626">Check</em></h1>
    <p class="auth-sub">Sicherheits- und Qualitätskontrolle für Immobilien</p>

    <div class="switcher">
      <button id="tab-login" class="active" onclick="setAuthMode('login')">Anmelden</button>
      <button id="tab-signup" onclick="setAuthMode('signup')">Registrieren</button>
    </div>

    <div id="auth-note" class="note hidden"></div>
    <div id="auth-err" class="err hidden"></div>

    <form id="auth-form" onsubmit="return doAuth(event)">
      <div class="field" id="field-name" style="display:none">
        <label>Vor- und Nachname</label>
        <input id="in-name" type="text" autocomplete="name" placeholder="Max Mustermann">
      </div>
      <div class="field">
        <label>E-Mail</label>
        <input id="in-email" type="email" autocomplete="email" required placeholder="name@firma.at">
      </div>
      <div class="field">
        <label>Passwort</label>
        <input id="in-pass" type="password" autocomplete="current-password" required minlength="6" placeholder="Mindestens 6 Zeichen">
      </div>
      <button class="btn full" id="auth-btn" type="submit">Anmelden</button>
    </form>
    <p class="xs muted" style="text-align:center;margin:14px 0 0">
      Die erste Registrierung wird automatisch Administrator.<br>
      Alle weiteren Konten muss der Administrator freigeben.<br>
      <a href="#" onclick="showSetup();return false" style="display:inline-block;margin-top:8px">Andere Datenbank verbinden</a>
    </p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="wrap">
      <div class="logo">
        <span class="mark">
          <svg width="17" height="17" viewBox="0 0 64 64" fill="none"><path d="M32 6 60 27v31a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V27L32 6Z" fill="#fff"/></svg>
        </span>
        Immo<em>Check</em>
      </div>
      <div class="spacer"></div>
      <div class="userchip" onclick="go('profil')">
        <div class="avatar" id="u-initials">–</div>
        <span id="u-name" class="hide-sm">…</span>
      </div>
      <button class="btn ghost" onclick="logout()" title="Abmelden">⏻</button>
    </div>
  </header>

  <nav class="tabs">
    <div class="wrap" id="nav-tabs"></div>
  </nav>

  <main>
    <div class="wrap" id="view"></div>
  </main>
</div>

<div id="modal-root"></div>

<script>
/* =========================================================
   KONFIGURATION
   ========================================================= */
/* Fest eingebaute Verbindung. Leer lassen, dann fragt die App beim ersten Start danach. */
const SUPABASE_URL = "https://mqmevpyatjsambervgtu.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xbWV2cHlhdGpzYW1iZXJ2Z3R1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMjA4NjUsImV4cCI6MjEwMTc5Njg2NX0.znjHbWgs6eSeWYBs7q6FtxIU6Q2k1jDejcANzVzU0Uw";

const CONF_STORE = "immocheck_verbindung";
function ladeVerbindung(){
  try{
    const c = JSON.parse(localStorage.getItem(CONF_STORE) || "null");
    if(c && c.url && c.key) return c;
  }catch(e){}
  if(SUPABASE_URL && SUPABASE_KEY && !SUPABASE_URL.startsWith("__")) return {url:SUPABASE_URL, key:SUPABASE_KEY};
  return null;
}
const CONF = ladeVerbindung();
const sb = CONF ? window.supabase.createClient(CONF.url, CONF.key, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
}) : null;

/* Bewertungsskala */
const SCALE = [
  {v:1, e:"😡", l:"Sehr schlecht", c:"#dc2626"},
  {v:2, e:"🙁", l:"Schlecht",      c:"#f97316"},
  {v:3, e:"😐", l:"Mittel",        c:"#eab308"},
  {v:4, e:"🙂", l:"Gut",           c:"#65a30d"},
  {v:5, e:"😍", l:"Sehr gut",      c:"#16a34a"}
];
const OBJEKTTYPEN = [
  ["einzimmerwohnung","Einzimmerwohnung"],
  ["wohnung","Wohnung"],
  ["einfamilienhaus","Einfamilienhaus"],
  ["doppelhaus","Doppelhaushälfte"],
  ["reihenhaus","Reihenhaus"],
  ["mehrfamilienhaus","Mehrfamilienhaus"],
  ["wohnanlage","Wohnanlage / mehrere Gebäude"],
  ["gewerbe","Gewerbeobjekt"],
  ["sonstiges","Sonstiges"]
];

/* Wie eine Frage beantwortet wird */
const ANTWORTTYPEN = [
  ["skala",    "Bewertung 1 bis 5",   "Die Emoji-Skala, fließt in die Gesamtnote ein"],
  ["ja_nein",  "Ja / Nein",           "Einfache Entscheidung, ohne Note"],
  ["messwert", "Messwert",            "Eine Zahl mit Einheit, zum Beispiel 21,5 °C"],
  ["auswahl",  "Auswahl",             "Eine Antwort aus einer eigenen Liste"],
  ["text",     "Freier Text",         "Kurze schriftliche Antwort"]
];
const typLabel = t => (ANTWORTTYPEN.find(a=>a[0]===t)||[,t])[1];

/* Gebäudestruktur, Auswahllisten für die Mehrfachauswahl */
const LEITUNGEN = ["Strom","Gas","Wasser","Kanal","Fernwärme","Öltank","Photovoltaik","Glasfaser","Kabel / TV","Klingel / Gegensprech","Blitzschutz","Notbeleuchtung"];
const KELLER_INHALT = ["Kellerabteile","Waschküche","Trockenraum","Heizraum","Technikraum","Fahrradraum","Kinderwagenraum","Müllraum","Tiefgarage","Lagerraum","Hausanschlussraum","Sauna"];
const EG_INHALT = ["Eingangsbereich","Briefkästen","Treppenhaus","Aufzug","Kinderwagenraum","Müllraum","Gemeinschaftsraum","Gewerbeeinheit","Innenhof","Garten","Fahrradstellplätze","Hausmeisterraum"];
const DG_INHALT = ["Dachbodenabteile","Trockenraum","Technikraum","Aufzugsmaschinenraum","Dachterrasse","Dachausstieg","Ausgebaut","Nicht ausgebaut"];

/* Baut eine Mehrfachauswahl aus Kästchen. gewaehlt ist ein Array aus der Datenbank. */
function chipAuswahl(name, optionen, gewaehlt){
  const aktiv = Array.isArray(gewaehlt) ? gewaehlt : [];
  return `<div class="chips">${optionen.map(o=>`
    <label class="chip">
      <input type="checkbox" name="${name}" value="${esc(o)}" ${aktiv.includes(o)?"checked":""}>
      <span>${esc(o)}</span>
    </label>`).join("")}</div>`;
}
const PRIOS = [
  ["keine","Keine"], ["niedrig","Niedrig"], ["mittel","Mittel"], ["hoch","Hoch"], ["kritisch","Kritisch"]
];
/* Objekttypen, die als Gebäude mit mehreren Einheiten gelten */
const MEHRPARTEIEN = ["mehrfamilienhaus","wohnanlage"];

/* Globaler Zustand */
const S = {
  user:null, profile:null, view:"dashboard", params:{},
  properties:[], categories:[], criteria:[], profiles:[],
  templates:[], templateCriteria:{}
};

/* =========================================================
   HELFER
   ========================================================= */
const $ = s => document.querySelector(s);
const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => d ? new Date(d).toLocaleDateString("de-AT",{day:"2-digit",month:"2-digit",year:"numeric"}) : "–";
const fmtDateTime = d => d ? new Date(d).toLocaleString("de-AT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "–";
const objLabel = k => (OBJEKTTYPEN.find(t=>t[0]===k)||[,k])[1];
const catName = id => (S.categories.find(c=>c.id===id)||{}).name || "Sonstiges";
const scaleOf = v => SCALE.find(s=>s.v===Number(v)) || null;

function toast(msg, ms=2600){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), ms);
}
function loading(on, target="#view"){
  if(on) $(target).innerHTML = '<div class="center-load"><div class="loader"></div></div>';
}
function scoreColor(s){
  if(s==null) return "#94a3b8";
  if(s>=4.5) return "#16a34a"; if(s>=3.5) return "#65a30d";
  if(s>=2.5) return "#eab308"; if(s>=1.5) return "#f97316"; return "#dc2626";
}
function scoreBadge(s){
  if(s==null) return '<span class="badge">Keine Bewertung</span>';
  const n = Number(s).toFixed(1);
  const cls = s>=4 ? "ok" : s>=3 ? "warn" : "bad";
  const em = scaleOf(Math.round(s));
  return `<span class="badge ${cls}">${em?em.e:""} ${n} / 5</span>`;
}
function initials(name, email){
  const n = (name||email||"?").trim();
  const p = n.split(/[\s@.]+/).filter(Boolean);
  return ((p[0]||"?")[0] + (p[1]? p[1][0] : "")).toUpperCase();
}
function openModal(html){
  el("modal-root").innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){ el("modal-root").innerHTML = ""; }

/* =========================================================
   AUTHENTIFIZIERUNG
   ========================================================= */
let authMode = "login";
function setAuthMode(m){
  authMode = m;
  el("tab-login").classList.toggle("active", m==="login");
  el("tab-signup").classList.toggle("active", m==="signup");
  el("field-name").style.display = m==="signup" ? "block" : "none";
  el("auth-btn").textContent = m==="signup" ? "Konto erstellen" : "Anmelden";
  el("in-pass").setAttribute("autocomplete", m==="signup" ? "new-password" : "current-password");
  el("auth-err").classList.add("hidden");
}
function authError(msg){
  const e = el("auth-err"); e.textContent = msg; e.classList.remove("hidden");
}
async function doAuth(ev){
  ev.preventDefault();
  const btn = el("auth-btn"); const old = btn.innerHTML;
  btn.innerHTML = '<div class="loader"></div>'; btn.disabled = true;
  el("auth-err").classList.add("hidden");
  const email = el("in-email").value.trim();
  const pass  = el("in-pass").value;
  const name  = el("in-name").value.trim();
  try{
    if(authMode==="signup"){
      const {error} = await sb.auth.signUp({email, password:pass, options:{data:{full_name:name}}});
      if(error) throw error;
      const {error:e2} = await sb.auth.signInWithPassword({email, password:pass});
      if(e2) throw e2;
    } else {
      const {error} = await sb.auth.signInWithPassword({email, password:pass});
      if(error) throw error;
    }
    await boot();
  }catch(err){
    let m = err.message || "Unbekannter Fehler";
    if(/Invalid login/i.test(m)) m = "E-Mail oder Passwort stimmt nicht.";
    if(/already registered|User already/i.test(m)) m = "Diese E-Mail ist bereits registriert. Bitte anmelden.";
    if(/Password should be/i.test(m)) m = "Das Passwort muss mindestens 6 Zeichen haben.";
    if(/Email not confirmed/i.test(m)) m = "Konto noch nicht freigeschaltet. Bitte kurz beim Administrator melden.";
    authError(m);
  }finally{
    btn.innerHTML = old; btn.disabled = false;
  }
}
async function logout(){
  await sb.auth.signOut();
  location.reload();
}

/* =========================================================
   START / STAMMDATEN LADEN
   ========================================================= */
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ el("view-auth").classList.remove("hidden"); el("app").classList.add("hidden"); return; }
  S.user = session.user;

  let prof = null;
  for(let versuch = 0; versuch < 4 && !prof; versuch++){
    const r = await sb.from("profiles").select("*").eq("id", S.user.id).maybeSingle();
    prof = r.data;
    if(!prof) await new Promise(r => setTimeout(r, 600));
  }
  S.profile = prof;

  if(!prof){
    showGate("problem");
    return;
  }
  if(prof.status !== "aktiv"){
    showGate(prof.status, prof);
    return;
  }

  el("view-auth").classList.add("hidden");
  el("app").classList.remove("hidden");
  el("u-name").textContent = prof?.full_name || S.user.email;
  el("u-initials").textContent = initials(prof?.full_name, S.user.email);

  renderTabs();
  await loadCatalog();
  go(S.view || "dashboard");
}

/* Zwischenbildschirm für Nutzer ohne Freigabe */
function showGate(art, prof){
  el("app").classList.add("hidden");
  el("view-auth").classList.remove("hidden");
  const inhalte = {
    wartend: {
      icon: `<svg width="58" height="58" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="27" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/><path d="M32 17v16l11 7" stroke="#1d4ed8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      titel: "Fast geschafft",
      text: "Dein Konto wurde angelegt. Aus Datenschutzgründen muss dich der Administrator noch freischalten, bevor du Immobilien und Protokolle sehen kannst.",
      hinweis: "Sag deinem Administrator kurz Bescheid. Sobald er dich freigegeben hat, genügt ein Klick auf Erneut prüfen."
    },
    gesperrt: {
      icon: `<svg width="58" height="58" viewBox="0 0 64 64" fill="none"><rect x="13" y="28" width="38" height="27" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><path d="M22 28v-8a10 10 0 0 1 20 0v8" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="41" r="3.6" fill="#dc2626"/></svg>`,
      titel: "Zugang gesperrt",
      text: "Dein Zugang wurde vom Administrator deaktiviert.",
      hinweis: "Wende dich bitte direkt an den Administrator, wenn das ein Irrtum ist."
    },
    problem: {
      icon: `<svg width="58" height="58" viewBox="0 0 64 64" fill="none"><path d="M32 9 60 55H4L32 9Z" fill="#fffbeb" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/><path d="M32 26v11" stroke="#f59e0b" stroke-width="3.4" stroke-linecap="round"/><circle cx="32" cy="45" r="2.6" fill="#f59e0b"/></svg>`,
      titel: "Konto wird noch eingerichtet",
      text: "Dein Profil konnte nicht geladen werden. In der Regel hilft ein erneuter Versuch nach ein paar Sekunden.",
      hinweis: "Bleibt es dabei, melde dich beim Administrator."
    }
  };
  const c = inhalte[art] || inhalte.problem;
  el("view-auth").innerHTML = `
    <div class="auth-card" style="text-align:center">
      <div style="margin-bottom:10px">${c.icon}</div>
      <h1 style="margin-bottom:8px">${c.titel}</h1>
      <p class="small muted" style="margin:0 0 16px">${c.text}</p>
      ${prof ? `<div class="note" style="text-align:left">Angemeldet als <strong>${esc(prof.full_name||prof.email)}</strong><br><span class="xs">${esc(prof.email)}</span></div>` : ""}
      <p class="xs muted" style="margin:0 0 18px">${c.hinweis}</p>

function renderTabs(){

  el("nav-tabs").innerHTML = tabs.map(([k,l]) =>
    `<button data-tab="${k}" class="${S.view===k?'active':''}" onclick="go('${k}')">${l}</button>`).join("");
}
function markTab(){
  document.querySelectorAll("#nav-tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === S.view));
}

async function loadCatalog(){
  const [cats, crits, tpls, tcs] = await Promise.all([
    sb.from("categories").select("*").eq("active", true).order("sort_order"),
    sb.from("criteria").select("*").eq("active", true).is("property_id", null).order("sort_order"),
    sb.from("templates").select("*").eq("active", true).order("sort_order"),
    sb.from("template_criteria").select("*")
  ]);
  S.categories = cats.data || [];
  S.criteria = crits.data || [];
  S.templates = tpls.data || [];
  S.templateCriteria = {};
  (tcs.data || []).forEach(r => {
    (S.templateCriteria[r.template_id] = S.templateCriteria[r.template_id] || new Set()).add(r.criterion_id);
  });
}
function tplPunkte(id){
  const set = S.templateCriteria[id];
  if(!set) return [];
  return S.criteria.filter(c => set.has(c.id));
}

/* =========================================================
   ROUTER
   ========================================================= */
function go(view, params={}){
  S.view = view; S.params = params;
  markTab();
  window.scrollTo({top:0});
  const R = {
    dashboard: viewDashboard,
    properties: viewProperties,
    property: viewProperty,
    inspection: viewInspection,
    inspectionResult: viewInspectionResult,
    templates: viewTemplates,
    catalog: viewCatalog,
    team: viewTeam,
    profil: viewProfil
  };
  (R[view] || viewDashboard)();
}

        <div><h3 style="margin:0">Durchschnittliche Bewertung</h3><div class="small muted">Über alle abgeschlossenen Begehungen</div></div>
        <div style="font-size:1.6rem;font-weight:800;color:${scoreColor(avg)}">${scaleOf(Math.round(avg))?.e||""} ${avg.toFixed(1)}</div>

async function saveProperty(ev, id){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const num = v => v==="" || v==null ? null : Number(v);
  const rec = {
    name: fd.get("name"), object_type: fd.get("object_type"),
    street: fd.get("street")||null, house_number: fd.get("house_number")||null,
    zip: fd.get("zip")||null, city: fd.get("city")||null,
    build_year: num(fd.get("build_year")), units_count: num(fd.get("units_count"))||1,
    floors: num(fd.get("floors")), living_area: num(fd.get("living_area")), plot_area: num(fd.get("plot_area")),
    heating_type: fd.get("heating_type")||null, energy_class: fd.get("energy_class")||null,
    has_basement: !!fd.get("has_basement"), has_attic: !!fd.get("has_attic"),
    has_garden: !!fd.get("has_garden"), has_parking: !!fd.get("has_parking"),
    elevator_count: num(fd.get("elevator_count")) || 0,
    has_elevator: (num(fd.get("elevator_count")) || 0) > 0,
    basement_units: num(fd.get("basement_units")), attic_units: num(fd.get("attic_units")),
    rooms_count: num(fd.get("rooms_count")), corridor_count: num(fd.get("corridor_count")),
    basement_count: num(fd.get("basement_count")),
    utilities: fd.getAll("utilities"), basement_content: fd.getAll("basement_content"),
    ground_content: fd.getAll("ground_content"), attic_content: fd.getAll("attic_content"),
    structure_notes: fd.get("structure_notes")||null,
    owner_name: fd.get("owner_name")||null, contact_name: fd.get("contact_name")||null,
    contact_phone: fd.get("contact_phone")||null, contact_email: fd.get("contact_email")||null,
    description: fd.get("description")||null
  };
  if(id) rec.status = fd.get("status") || "aktiv"; else rec.created_by = S.user.id;

  const q = id ? sb.from("properties").update(rec).eq("id", id) : sb.from("properties").insert(rec).select().single();
  const {data, error} = await q;
  if(error){ toast("Fehler: "+error.message, 4000); return false; }
  closeModal(); toast("Gespeichert ✓");
  if(id) go("property",{id}); else go("property",{id:data.id});
  return false;
}

async function deleteProperty(id){
  if(!confirm("Immobilie inklusive aller Begehungen und Protokolle unwiderruflich löschen?")) return;
  const {error} = await sb.from("properties").delete().eq("id", id);
  if(error){ toast("Fehler: "+error.message, 4000); return; }
  closeModal(); toast("Gelöscht"); go("properties");
}

    openModal(`

        ${unitId?"":`<div class="field">
          <label>Wie viele gleiche Einheiten?</label>
          <input name="anzahl" type="number" min="1" max="200" value="1">
          <div class="xs muted" style="margin-top:4px">Bei mehr als 1 wird durchnummeriert, aus "Top 1" werden "Top 1", "Top 2", "Top 3" und so weiter.</div>
        </div>`}
        <div class="grid g3">
          <div class="field"><label>Geschoss</label><input name="floor" value="${f("floor")}" placeholder="EG, 1. OG"></div>
          <div class="field"><label>Zimmer</label><input name="rooms" type="number" step="0.5" value="${f("rooms")}"></div>
          <div class="field"><label>Fläche m²</label><input name="area" type="number" step="0.01" value="${f("area")}"></div>
        </div>
        <div class="grid g2">
          <div class="field"><label>Mieter</label><input name="tenant_name" value="${f("tenant_name")}"></div>
          <div class="field"><label>Mieter seit</label><input name="tenant_since" type="date" value="${f("tenant_since")}"></div>
        </div>
        <div class="field"><label>Notiz</label><textarea name="notes">${f("notes")}</textarea></div>
        <div class="row">
          <button type="button" class="btn sec" onclick="closeModal()">Abbrechen</button>
          <div class="spacer"></div>
          ${unitId?`<button type="button" class="btn danger sm" onclick="deleteUnit('${unitId}','${propId}')">Löschen</button>`:""}
          <button class="btn" type="submit">Speichern</button>
        </div>
      </form>`);
  };
  load();
}
async function saveUnit(ev, propId, unitId){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const num = v => v===""||v==null ? null : Number(v);
  const rec = {property_id:propId, label:fd.get("label"), floor:fd.get("floor")||null,
    rooms:num(fd.get("rooms")), area:num(fd.get("area")), tenant_name:fd.get("tenant_name")||null,
    tenant_since:fd.get("tenant_since")||null, notes:fd.get("notes")||null};

  let error;
  if(unitId){
    ({error} = await sb.from("units").update(rec).eq("id",unitId));
  } else {
    const anzahl = Math.min(Math.max(num(fd.get("anzahl")) || 1, 1), 200);
    let saetze = [rec];
    if(anzahl > 1){
      const belegt = ((await sb.from("units").select("label").eq("property_id",propId)).data||[]).map(x=>x.label);
      saetze = [rec];
      for(let i=1; i<anzahl; i++){
        const vorher = saetze[saetze.length-1].label;
        saetze.push({...rec, label: naechsteBezeichnung(vorher, belegt.concat(saetze.map(s=>s.label))),
                     tenant_name:null, tenant_since:null});
      }
    }
    ({error} = await sb.from("units").insert(saetze));
    if(!error) toast(anzahl > 1 ? `${anzahl} Einheiten angelegt ✓` : "Gespeichert ✓");
  }
  if(error){ toast("Fehler: "+error.message,4000); return false; }
  closeModal();
  if(unitId) toast("Gespeichert ✓");
  go("property",{id:propId});
  return false;
}
async function deleteUnit(unitId, propId){
  if(!confirm("Einheit löschen?")) return;
  await sb.from("units").delete().eq("id",unitId);
  closeModal(); go("property",{id:propId});
}

async function savePlan(ev, propId, planId){

    unit_id: fd.get("unit_id") || null,
    title: fd.get("title") || "Begehung",
    start_date: fd.get("start_date"),
    start_time: fd.get("start_time") || "09:00",

/* Blendet die Zusatzfelder ein, die zum gewählten Antworttyp gehören. */
function typFelder(typ){
  const m = document.getElementById("typ-messwert");
  const a = document.getElementById("typ-auswahl");
  if(m) m.style.display = typ === "messwert" ? "grid" : "none";

async function savePropCriterion(ev, propId, critId){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const zahl = v => v==="" || v==null ? null : Number(v);
  const typ = fd.get("answer_type") || "skala";
  const rec = {
    property_id: propId,
    category_id: fd.get("category_id"),
    name: fd.get("name"),
    hint: fd.get("hint") || null,
    scope: fd.get("scope") || "beide",
    critical: !!fd.get("critical"),
    answer_type: typ,
    unit: typ === "messwert" ? (fd.get("unit") || null) : null,
    min_value: typ === "messwert" ? zahl(fd.get("min_value")) : null,
    max_value: typ === "messwert" ? zahl(fd.get("max_value")) : null,
    options: typ === "auswahl"
      ? String(fd.get("options")||"").split(",").map(s=>s.trim()).filter(Boolean)
      : [],
    is_system: false,
    active: true
  };
  if(typ === "auswahl" && !rec.options.length){
    toast("Bitte mindestens eine Antwortmöglichkeit angeben.", 4000); return false;
  }
  if(!critId){ rec.created_by = S.user.id; rec.sort_order = 900; }
  const {error} = critId
    ? await sb.from("criteria").update(rec).eq("id",critId)
    : await sb.from("criteria").insert(rec);
  if(error){ toast("Fehler: "+error.message,4000); return false; }
  closeModal(); toast("Gespeichert ✓"); go("property",{id:propId});
  return false;
}

async function deletePropCriterion(critId, propId){
  if(!confirm("Diese Frage löschen? Bereits durchgeführte Begehungen bleiben unverändert.")) return;
  const {error} = await sb.from("criteria").delete().eq("id",critId);
  if(error){ toast("Fehler: "+error.message,4000); return; }
  closeModal(); toast("Gelöscht ✓"); go("property",{id:propId});
}

/* Nächste freie Bezeichnung: "Top 3" wird zu "Top 4", "EG links" zu "EG links 2". */
function naechsteBezeichnung(basis, vorhanden){
  const treffer = String(basis||"Einheit").match(/^(.*?)(\d+)\s*$/);
  let stamm, n;
  if(treffer){ stamm = treffer[1]; n = Number(treffer[2]) + 1; }
  else { stamm = String(basis||"Einheit") + " "; n = 2; }
  const genommen = new Set((vorhanden||[]).map(x=>String(x||"").trim().toLowerCase()));
  let kandidat, schutz = 0;
  do { kandidat = (stamm + n).trim(); n++; schutz++; }
  while(genommen.has(kandidat.toLowerCase()) && schutz < 500);
  return kandidat;
}

/* Legt eine Kopie der Einheit an. Mieterdaten werden bewusst nicht mitkopiert. */
async function duplicateUnit(unitId, propId){
  const [einzeln, alle] = await Promise.all([
    sb.from("units").select("*").eq("id",unitId).maybeSingle(),
    sb.from("units").select("label").eq("property_id",propId)
  ]);
  const u = einzeln.data;
  if(!u){ toast("Einheit nicht gefunden", 3000); return; }
  const rec = {
    property_id: propId,
    label: naechsteBezeichnung(u.label, (alle.data||[]).map(x=>x.label)),
    floor: u.floor, rooms: u.rooms, area: u.area, notes: u.notes
  };
  const {error} = await sb.from("units").insert(rec);
  if(error){ toast("Fehler: "+error.message, 4000); return; }
  toast(`Angelegt: ${rec.label} ✓`);
  go("property",{id:propId});
}

function waehleTpl(input){

async function createInspection(ev, propId){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const tplId = fd.get("template_id");
  const tpl = S.templates.find(t => t.id === tplId);
  const unitId = fd.get("unit_id") || null;

  /* Eigene Fragen dieses Objekts dazunehmen, aber nur die, die zum Umfang passen. */
  const erlaubt = unitId ? ["einheit","beide"] : ["gebaeude","beide"];
  const eigene = ((await sb.from("criteria").select("*")
      .eq("property_id", propId).eq("active", true).order("sort_order")).data || [])
    .filter(c => erlaubt.includes(c.scope || "beide"));

  const punkte = tplPunkte(tplId).concat(eigene);
  if(!punkte.length){ toast("Dieser Katalog enthält keine Prüfpunkte.", 4000); return false; }

  const rec = {
    property_id: propId,
    unit_id: unitId,
    title: fd.get("title") || "Begehung",
    inspection_date: fd.get("inspection_date"),
    inspector_id: S.user.id,
    inspector_name: fd.get("inspector_name") || null,
    weather: fd.get("weather") || null,
    present_persons: fd.get("present_persons") || null,
    template_id: tplId || null,
    template_name: tpl ? tpl.name : null,
    status: "offen"
  };
  const {data:insp, error} = await sb.from("inspections").insert(rec).select().single();
  if(error){ toast("Fehler: "+error.message,4000); return false; }

  const items = punkte.map(c => {
    const cat = S.categories.find(k => k.id === c.category_id) || {key:"sonstiges", name:"Sonstiges", sort_order:999};
    return {
      inspection_id: insp.id, criterion_id: c.id,
      category_key: cat.key, category_name: cat.name,
      criterion_name: c.name, hint: c.hint,
      sort_order: cat.sort_order*1000 + c.sort_order,
      critical: c.critical, presence: "offen",
      answer_type: c.answer_type || "skala",
      unit: c.unit || null,
      options: c.options || [],
      min_value: c.min_value ?? null,
      max_value: c.max_value ?? null
    };
  }).sort((a,b)=>a.sort_order-b.sort_order);
  for(let i=0;i<items.length;i+=200){
    const {error:e2} = await sb.from("inspection_items").insert(items.slice(i,i+200));
    if(e2){ toast("Fehler beim Anlegen: "+e2.message,4000); return false; }
  }
  closeModal(); toast("Begehung gestartet ✓");
  go("inspection",{id:insp.id});
  return false;
}

   BEGEHUNG DURCHFÜHREN
   ========================================================= */
const IS = { insp:null, prop:null, unit:null, items:[], photoUrls:{}, scanUrls:[], filter:"alle", skipped:{} };

/* Punkte, die tatsächlich in die Wertung eingehen */
function aktiveItems(items){
  return (items||[]).filter(i => !i.hidden && !(IS.skipped && IS.skipped[i.category_key] !== undefined));
}
function istUebersprungen(key){ return IS.skipped && IS.skipped[key] !== undefined; }

async function loadInspection(id){
  const insp = (await sb.from("inspections").select("*").eq("id",id).maybeSingle()).data;
  if(!insp) return null;
  const prop = (await sb.from("properties").select("*").eq("id",insp.property_id).maybeSingle()).data;
  const items = (await sb.from("inspection_items").select("*").eq("inspection_id",id).order("sort_order")).data || [];
  IS.unit = insp.unit_id
    ? (await sb.from("units").select("*").eq("id",insp.unit_id).maybeSingle()).data
    : null;
  IS.insp = insp; IS.prop = prop; IS.items = items;
  /* Durchlaufende Nummer, identisch mit der auf dem Papierbogen */
  aktiveItems(items).slice().sort((a,b)=>a.sort_order-b.sort_order)
    .forEach((it, idx) => { it.__nr = idx + 1; });
  IS.skipped = (insp.skipped_categories && typeof insp.skipped_categories === "object") ? insp.skipped_categories : {};
  const paths = items.filter(i=>i.photo_path).map(i=>i.photo_path);
  IS.photoUrls = {};
  if(paths.length){
    const {data} = await sb.storage.from("check-fotos").createSignedUrls(paths, 3600);
    (data||[]).forEach(d => { if(d.signedUrl) IS.photoUrls[d.path] = d.signedUrl; });
  }
  IS.notizen = (await sb.from("inspection_notes").select("*")
    .eq("inspection_id", id).order("created_at")).data || [];
  /* Eingescannte Papierbögen */
  IS.scanUrls = [];
  const scans = Array.isArray(insp.scan_paths) ? insp.scan_paths : [];
  if(scans.length){
    const {data} = await sb.storage.from("check-fotos").createSignedUrls(scans, 3600);
    IS.scanUrls = scans.map(p => ({path:p, url:(data||[]).find(d=>d.path===p)?.signedUrl || null}));
  }
  return insp;
}

function itemStats(items){
  const rated = items.filter(i=>i.rating!=null);
  const answered = items.filter(i=>i.presence && i.presence!=="offen");
  const relevant = items.filter(i=>i.presence!=="nicht_relevant");
  const score = rated.length ? rated.reduce((a,b)=>a+b.rating,0)/rated.length : null;
  const missing = items.filter(i=>i.presence==="nicht_vorhanden");
  const defects = items.filter(i=>i.defect);
  const critical = items.filter(i=>(i.critical && i.presence==="nicht_vorhanden") || i.priority==="kritisch");
  return {rated, answered, relevant, score, missing, defects, critical,
    progress: items.length ? Math.round(answered.length/items.length*100) : 0};
}

  loading(true);

  if(insp.status === "abgeschlossen"){ return go("inspectionResult",{id:insp.id}); }
  renderInspection();
}

   Mehrere Seiten auf einmal sind möglich. */
async function uploadScan(input){
  const dateien = [...(input.files||[])];
  if(!dateien.length) return;
  toast(`${dateien.length} Seite${dateien.length>1?"n":""} wird hochgeladen …`);
  try{
    const neu = [];
    for(const file of dateien){
      const blob = await resizeImage(file, 2000, .8);   // höher als Fotos, damit Handschrift lesbar bleibt
      const path = `scans/${IS.insp.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
      const {error} = await sb.storage.from("check-fotos").upload(path, blob, {contentType:"image/jpeg", upsert:true});
      if(error) throw error;
      neu.push(path);
    }
    const alle = (Array.isArray(IS.insp.scan_paths) ? IS.insp.scan_paths : []).concat(neu);
    const {error:e2} = await sb.from("inspections").update({scan_paths: alle}).eq("id", IS.insp.id);
    if(e2) throw e2;

    input.value = "";
    await loadInspection(IS.insp.id);
    renderScanCard();
    toast(`${neu.length} Seite${neu.length>1?"n":""} gespeichert ✓`);
  }catch(err){ toast("Scan-Fehler: "+(err.message||err), 5000); }

async function deleteScan(path){
  if(!confirm("Diese Seite entfernen?")) return;
  try{
    await sb.storage.from("check-fotos").remove([path]);
    const rest = (IS.insp.scan_paths||[]).filter(p => p !== path);
    await sb.from("inspections").update({scan_paths: rest}).eq("id", IS.insp.id);
    IS.insp.scan_paths = rest;

/* =========================================================
   TERMINE UND KALENDER
   Erzeugt eine Termindatei nach iCalendar. Die verstehen Apple, Google,
   Outlook, Microsoft 365 und Android gleichermaßen, ganz ohne Anmeldung.
   ========================================================= */
const FREQ_LABEL = {einmalig:"einmalig", wochen:"Wochen", monate:"Monate", jahre:"Jahre"};

function planText(pl){
  if(pl.freq === "einmalig") return "einmalig";
  const n = pl.interval_n || 1;
  if(pl.freq === "wochen") return n === 1 ? "jede Woche" : `alle ${n} Wochen`;
  if(pl.freq === "monate") return n === 1 ? "jeden Monat" : `alle ${n} Monate`;
  return n === 1 ? "jedes Jahr" : `alle ${n} Jahre`;
}
function planRRule(pl){
  if(pl.freq === "einmalig") return null;
  const f = pl.freq === "wochen" ? "WEEKLY" : pl.freq === "monate" ? "MONTHLY" : "YEARLY";
  return `FREQ=${f};INTERVAL=${Math.max(1, pl.interval_n||1)}`;
}
/* Nächster Termin ab heute, damit die Übersicht stimmt. */
function naechsterTermin(pl){
  const start = new Date(pl.start_date + "T00:00:00");
  const heute = new Date(); heute.setHours(0,0,0,0);
  if(pl.freq === "einmalig" || start >= heute) return pl.start_date;
  const n = Math.max(1, pl.interval_n||1);
  const d = new Date(start);
  let schutz = 0;
  while(d < heute && schutz++ < 2000){
    if(pl.freq === "wochen")      d.setDate(d.getDate() + 7*n);
    else if(pl.freq === "monate") d.setMonth(d.getMonth() + n);
    else                          d.setFullYear(d.getFullYear() + n);
  }
  return d.toISOString().slice(0,10);
}

function icsEscape(s){
  return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
}
/* Zeilen über 75 Zeichen müssen nach der Norm umgebrochen werden. */
function icsFalten(zeile){
  if(zeile.length <= 74) return zeile;
  let out = zeile.slice(0,74), rest = zeile.slice(74);
  while(rest.length > 73){ out += "\r\n " + rest.slice(0,73); rest = rest.slice(73); }
  return out + "\r\n " + rest;
}
function zeitStempel(datum, zeit){
  return datum.replace(/-/g,"") + "T" + String(zeit||"09:00").replace(":","") + "00";
}
function plusMinuten(datum, zeit, min){
  const d = new Date(`${datum}T${(zeit||"09:00")}:00`);
  d.setMinutes(d.getMinutes() + (min||120));
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
}

function icsBauen(pl, prop, unitLabel){
  const adresse = [[prop.street, prop.house_number].filter(Boolean).join(" "),
                   [prop.zip, prop.city].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  const titel = `${pl.title || "Begehung"}: ${prop.name}${unitLabel ? " / "+unitLabel : ""}`;
  const beschreibung = [
    pl.notes || "",
    `Turnus: ${planText(pl)}`,
    `Erinnerung: ${pl.reminder_days} Tage vorher`,
    "Angelegt mit ImmoCheck"
  ].filter(Boolean).join("\n");
  const rrule = planRRule(pl);
  /* Ortszeit ohne Zeitzonenangabe: der Termin gilt in der Zeit des Geräts, genau richtig für einen Vor-Ort-Termin. */
  const zeilen = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//ImmoCheck//Begehungstermin//DE",
    "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    `UID:${pl.id}@immocheck`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").split(".")[0]}Z`,
    `DTSTART:${zeitStempel(pl.start_date, pl.start_time)}`,
    `DTEND:${plusMinuten(pl.start_date, pl.start_time, pl.duration_min)}`,
    rrule ? `RRULE:${rrule}` : null,
    `SUMMARY:${icsEscape(titel)}`,
    adresse ? `LOCATION:${icsEscape(adresse)}` : null,
    `DESCRIPTION:${icsEscape(beschreibung)}`,
    "BEGIN:VALARM",
    `TRIGGER:-P${Math.max(0, pl.reminder_days ?? 3)}D`,
    "ACTION:DISPLAY",
    `DESCRIPTION:${icsEscape(titel + " in " + (pl.reminder_days ?? 3) + " Tagen")}`,
    "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"
  ].filter(Boolean);
  return zeilen.map(icsFalten).join("\r\n") + "\r\n";
}

function terminDatei(planId){
  const pl = (IS.plaene||[]).find(x=>x.id===planId);
  if(!pl){ toast("Termin nicht gefunden", 3000); return; }
  const ics = icsBauen(pl, IS.planProp, pl.__unitLabel);
  const blob = new Blob([ics], {type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Begehung_${(IS.planProp.name||"Objekt").replace(/[^\wäöüÄÖÜß -]/g,"").trim().replace(/\s+/g,"_")}_${pl.start_date}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast("Termindatei erstellt, öffne sie mit deinem Kalender ✓");
}

function googleLink(pl, prop, unitLabel){
  const titel = `${pl.title||"Begehung"}: ${prop.name}${unitLabel?" / "+unitLabel:""}`;
  const adresse = [[prop.street, prop.house_number].filter(Boolean).join(" "),
                   [prop.zip, prop.city].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  const p = new URLSearchParams({
    action:"TEMPLATE", text:titel,
    dates:`${zeitStempel(pl.start_date, pl.start_time)}/${plusMinuten(pl.start_date, pl.start_time, pl.duration_min)}`,
    details:[pl.notes||"", `Turnus: ${planText(pl)}`, "Angelegt mit ImmoCheck"].filter(Boolean).join("\n"),
    location:adresse
  });
  const r = planRRule(pl);
  if(r) p.append("recur", "RRULE:"+r);
  return "https://calendar.google.com/calendar/render?" + p.toString();
}
function outlookLink(pl, prop, unitLabel){
  const titel = `${pl.title||"Begehung"}: ${prop.name}${unitLabel?" / "+unitLabel:""}`;
  const adresse = [[prop.street, prop.house_number].filter(Boolean).join(" "),
                   [prop.zip, prop.city].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  const start = `${pl.start_date}T${(pl.start_time||"09:00")}:00`;
  const ende = (() => {
    const d = new Date(start); d.setMinutes(d.getMinutes() + (pl.duration_min||120));
    const q = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}-${q(d.getMonth()+1)}-${q(d.getDate())}T${q(d.getHours())}:${q(d.getMinutes())}:00`;
  })();
  const p = new URLSearchParams({
    path:"/calendar/action/compose", rru:"addevent", subject:titel,
    startdt:start, enddt:ende, location:adresse,
    body:[pl.notes||"", `Turnus: ${planText(pl)}`].filter(Boolean).join("\n")
  });
  return "https://outlook.live.com/calendar/0/deeplink/compose?" + p.toString();
}

/* =========================================================
   NOTIZEN UND DIKTAT WÄHREND DER BEGEHUNG
   ========================================================= */
const SCHADEN_WOERTER = ["schaden","schäden","riss","risse","schimmel","feucht","nass","undicht",
  "wasserschaden","kaputt","defekt","gebrochen","locker","rost","fleck","tropft","leck","bruch",
  "abgeplatzt","verstopft","morsch","verzogen","wackelt","fehlt"];
function istSchaden(t){
  const s = String(t||"").toLowerCase();
  return SCHADEN_WOERTER.some(w => s.includes(w));
}

let DIKTAT = null;
function diktatVerfuegbar(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }

function diktatUmschalten(){
  if(DIKTAT){ stopDiktat(); return; }
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!R){ toast("Dieser Browser kann kein Diktat. Tippen funktioniert weiterhin.", 5000); return; }
  const r = new R();
  r.lang = "de-DE"; r.continuous = true; r.interimResults = true;
  let fest = (el("notiz-text")?.value || "");
  if(fest && !fest.endsWith(" ")) fest += " ";
  r.onresult = e => {
    let vorlaeufig = "";
    for(let i=e.resultIndex; i<e.results.length; i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal) fest += t + " "; else vorlaeufig += t;
    }
    const feld = el("notiz-text");
    if(feld) feld.value = (fest + vorlaeufig).replace(/\s+/g," ").trimStart();
  };
  r.onerror = e => {
    toast("Diktat: " + (e.error==="not-allowed" ? "Mikrofon nicht freigegeben"
          : e.error==="no-speech" ? "nichts gehört" : e.error), 4000);
    if(e.error === "not-allowed") stopDiktat();
  };
  r.onend = () => { if(DIKTAT === r){ try{ r.start(); }catch(e){} } };   // läuft weiter, bis du beendest
  DIKTAT = r;
  try{ r.start(); }catch(e){}
  const b = el("diktat-btn");
  if(b){ b.classList.add("aufnahme"); b.innerHTML = "⏹ Diktat beenden"; }
  toast("Diktat läuft, sprich einfach los.");
}
function stopDiktat(){
  const r = DIKTAT; DIKTAT = null;
  if(r){ try{ r.onend = null; r.stop(); }catch(e){} }
  const b = el("diktat-btn");
  if(b){ b.classList.remove("aufnahme"); b.innerHTML = "🎤 Diktat starten"; }
}

async function speichereNotiz(){
  const feld = el("notiz-text"), raumFeld = el("notiz-raum");
  const text = (feld?.value || "").trim();
  if(!text){ toast("Es ist noch nichts aufgeschrieben.", 3000); return; }
  const rec = {
    inspection_id: IS.insp.id, property_id: IS.prop.id,
    room: (raumFeld?.value || "").trim() || null,
    text, damage: istSchaden(text),
    source: DIKTAT ? "diktat" : (IS.letzteQuelle || "getippt"),
    created_by: S.user.id
  };
  const {data, error} = await sb.from("inspection_notes").insert(rec).select().single();
  if(error){ toast("Fehler: "+error.message, 4000); return; }
  IS.notizen = (IS.notizen||[]).concat([data]);
  if(feld) feld.value = "";
  IS.letzteQuelle = "getippt";

  n.damage = !n.damage;

function renderNotizCard(){
  const ziel = document.getElementById("notiz-card");
  if(ziel) ziel.outerHTML = notizCardHtml();
}

function notizCardHtml(){
  const notizen = (IS.notizen||[]).slice().sort((a,b)=>(a.created_at||"").localeCompare(b.created_at||""));
  const raeume = [...new Set(notizen.map(n=>n.room).filter(Boolean))];
  const vorschlaege = [...new Set(raeume.concat(
    ["Keller","Erdgeschoss","Dachgeschoss","Treppenhaus","Waschküche","Heizraum","Bad","Küche","Wohnzimmer","Schlafzimmer","Flur","Hof","Fassade","Dach","Tiefgarage"]))];
  const schaeden = notizen.filter(n=>n.damage).length;

  return `<div class="card" id="notiz-card">
    <div class="row between"><h3 style="margin:0">Notizen und Diktat ${notizen.length?`<span class="badge brand">${notizen.length}</span>`:""}</h3>
      ${schaeden?`<span class="badge warn">${schaeden} als Schaden markiert</span>`:""}</div>
    <div class="small muted" style="margin-bottom:10px">

async function uploadPhoto(itemId, input){
  const file = input.files[0]; if(!file) return;
  toast("Foto wird hochgeladen …");
  try{
    const blob = await resizeImage(file, 1400, .75);
    const path = `${IS.insp.id}/${itemId}-${Date.now()}.jpg`;
    const {error} = await sb.storage.from("check-fotos").upload(path, blob, {contentType:"image/jpeg", upsert:true});
    if(error) throw error;
    await saveItem(itemId, {photo_path: path});
    const {data} = await sb.storage.from("check-fotos").createSignedUrl(path, 3600);
    IS.photoUrls[path] = data.signedUrl;
    refreshItem(itemId);
    toast("Foto gespeichert ✓");
  }catch(err){ toast("Foto-Fehler: "+(err.message||err), 4000); }
}
async function removePhoto(itemId){
  const it = IS.items.find(x=>x.id===itemId);
  if(it.photo_path) await sb.storage.from("check-fotos").remove([it.photo_path]);
  await saveItem(itemId, {photo_path:null});
  refreshItem(itemId);
}
function resizeImage(file, maxSize, quality){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = () => {
      let {width:w, height:h} = img;
      const scale = Math.min(1, maxSize/Math.max(w,h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      c.toBlob(b => b ? res(b) : rej(new Error("Bild konnte nicht verarbeitet werden")), "image/jpeg", quality);
    };
    img.onerror = () => rej(new Error("Bild konnte nicht gelesen werden"));
    img.src = URL.createObjectURL(file);
  });
}

async function saveCustomItem(ev){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const ck = fd.get("category_key");
  const cat = S.categories.find(c=>c.key===ck);
  const name = fd.get("criterion_name");
  const hint = fd.get("hint")||null;
  const critical = !!fd.get("critical");
  let criterionId = null;

  if(fd.get("permanent")){
    const maxOrd = Math.max(0, ...S.criteria.filter(c=>c.category_id===cat.id).map(c=>c.sort_order));
    const {data, error} = await sb.from("criteria").insert({
      category_id:cat.id, name, hint, critical, sort_order:maxOrd+10,
      is_system:false, created_by:S.user.id, scope:"beide"
    }).select().single();
    if(error){ toast("Fehler: "+error.message,4000); return false; }
    criterionId = data.id; S.criteria.push(data);
  }
  const maxSort = Math.max(0, ...IS.items.filter(i=>i.category_key===ck).map(i=>i.sort_order));
  const {data:item, error:e2} = await sb.from("inspection_items").insert({
    inspection_id: IS.insp.id, criterion_id: criterionId,
    category_key: ck, category_name: cat.name, criterion_name: name, hint,
    sort_order: maxSort+1, critical, is_custom:true, presence:"offen"
  }).select().single();
  if(e2){ toast("Fehler: "+e2.message,4000); return false; }
  IS.items.push(item);
  IS.items.sort((a,b)=>a.sort_order-b.sort_order);
  closeModal(); renderInspection();
  const node = el("item-"+item.id);
  if(node){ node.closest(".cat").classList.add("open"); node.scrollIntoView({behavior:"smooth",block:"center"}); }
  toast("Prüfpunkt hinzugefügt ✓");
  return false;
}

  await sb.from("inspection_items").delete().eq("id",id);

async function finishInspection(){
  const aktive = aktiveItems(IS.items);
  const st = itemStats(aktive);
  const offen = aktive.length - st.answered.length;
  if(offen > 0 && !confirm(`Es sind noch ${offen} Prüfpunkte unbearbeitet. Trotzdem abschließen?`)) return;
  const patch = {
    status:"abgeschlossen",
    completed_at: new Date().toISOString(),
    score: st.score!=null ? Number(st.score.toFixed(2)) : null,
    score_percent: st.score!=null ? Number((st.score/5*100).toFixed(1)) : null,
    rated_count: st.rated.length,
    missing_count: st.missing.length,
    defect_count: st.defects.length,
    critical_count: st.critical.length,
    hidden_count: IS.items.filter(i=>i.hidden).length,
    skipped_categories: IS.skipped,
    general_notes: el("gen-notes") ? el("gen-notes").value : IS.insp.general_notes
  };
  const {error} = await sb.from("inspections").update(patch).eq("id", IS.insp.id);
  if(error){ toast("Fehler: "+error.message,4000); return; }
  toast("Begehung abgeschlossen ✓");
  go("inspectionResult",{id:IS.insp.id});
}

/* =========================================================
   AUSWERTUNG
   Regelbasiert. Jede Aussage lässt sich auf konkrete Prüfpunkte zurückführen,
   es wird nichts geschätzt und nichts geraten.
   ========================================================= */
function analysiere(insp, prop, items, historie, notizen){
  const aktiv = aktiveItems(items);
  const st = itemStats(aktiv);
  const befunde = [];
  const notiz = notizen || IS.notizen || [];
  const nenne = liste => liste.slice(0,6).map(i=>i.criterion_name)
    .concat(liste.length>6 ? [`und ${liste.length-6} weitere`] : []);

  /* 1. Sicherheitsrelevantes */
  const sicherheit = aktiv.filter(i => i.critical &&
    (i.presence === "nicht_vorhanden" || (i.rating!=null && i.rating<=2) || i.priority==="kritisch"));
  if(sicherheit.length) befunde.push({stufe:"kritisch",
    titel:`${sicherheit.length} sicherheitsrelevante${sicherheit.length===1?"r":""} Punkt${sicherheit.length===1?"":"e"} nicht in Ordnung`,
    text:"Diese Punkte betreffen die Sicherheit und sollten vor allen anderen erledigt werden.",
    punkte:nenne(sicherheit)});

  /* 2. Messwerte außerhalb des sinnvollen Bereichs */
  const ausReisser = aktiv.filter(i => i.answer_type==="messwert" && i.value_num!=null &&
    ((i.min_value!=null && Number(i.value_num) < Number(i.min_value)) ||
     (i.max_value!=null && Number(i.value_num) > Number(i.max_value))));
  if(ausReisser.length) befunde.push({stufe:"warnung",
    titel:`${ausReisser.length} Messwert${ausReisser.length===1?"":"e"} außerhalb des Bereichs`,
    text:"Gemessen wurde " + ausReisser.slice(0,4).map(i =>
      `${i.criterion_name}: ${i.value_num}${i.unit?" "+i.unit:""} (erwartet ${i.min_value??"–"} bis ${i.max_value??"–"})`).join("; ") + ".",
    punkte:nenne(ausReisser)});

  /* 3. Schlechte Bewertungen ohne Sicherheitsbezug */
  const schlecht = aktiv.filter(i => !i.critical && i.rating!=null && i.rating<=2);
  if(schlecht.length) befunde.push({stufe:"warnung",
    titel:`${schlecht.length} Punkt${schlecht.length===1?"":"e"} schlecht bewertet`,
    text:"Mit 1 oder 2 bewertet, hier besteht Handlungsbedarf ohne unmittelbare Gefahr.",
    punkte:nenne(schlecht)});

  /* 4. Fristen überschritten */
  const heute = new Date().toISOString().slice(0,10);
  const ueberfaellig = aktiv.filter(i => i.due_date && i.due_date < heute && i.defect);
  if(ueberfaellig.length) befunde.push({stufe:"warnung",
    titel:`${ueberfaellig.length} Frist${ueberfaellig.length===1?"":"en"} überschritten`,
    text:"Für diese Mängel ist die eingetragene Frist bereits verstrichen.",
    punkte:nenne(ueberfaellig)});

  /* 4b. Was vor Ort gesagt oder notiert wurde */
  const schadenNotizen = notiz.filter(n => n.damage);
  if(schadenNotizen.length){
    const raeume = [...new Set(schadenNotizen.map(n => n.room || "ohne Raumangabe"))];
    befunde.push({stufe:"warnung",
      titel:`${schadenNotizen.length} Schadensmeldung${schadenNotizen.length===1?"":"en"} aus der Begehung`,
      text:`Vor Ort festgehalten in: ${raeume.join(", ")}.`,
      punkte: schadenNotizen.slice(0,6).map(n => `${n.room?n.room+": ":""}${n.text}`)
        .concat(schadenNotizen.length>6 ? [`und ${schadenNotizen.length-6} weitere`] : [])});
  }

  /* 5. Unvollständigkeit, das schränkt die Aussagekraft ein */
  const offen = aktiv.filter(i => !i.presence || i.presence==="offen");
  const versteckt = items.filter(i=>i.hidden).length;
  const ausgeschlossen = Object.keys(insp.skipped_categories||IS.skipped||{}).length;
  if(offen.length || versteckt || ausgeschlossen){
    const teile = [];
    if(offen.length)      teile.push(`${offen.length} Punkte unbearbeitet`);
    if(versteckt)         teile.push(`${versteckt} ausgeblendet`);
    if(ausgeschlossen)    teile.push(`${ausgeschlossen} Bereiche ausgeschlossen`);
    befunde.push({stufe:"hinweis", titel:"Die Begehung ist nicht vollständig",
      text:teile.join(", ") + ". Das Ergebnis bildet nur den geprüften Teil ab.",
      punkte:nenne(offen)});
  }

  /* 6. Entwicklung gegenüber der letzten abgeschlossenen Begehung */
  const frueher = (historie||[])
    .filter(h => h.id !== insp.id && h.status==="abgeschlossen" && h.score!=null)
    .sort((a,b) => (b.inspection_date||"").localeCompare(a.inspection_date||""));
  let trend = null;
  if(frueher.length && st.score!=null){
    const vor = Number(frueher[0].score);
    const diff = st.score - vor;
    trend = {vorher:vor, jetzt:+st.score.toFixed(2), diff:+diff.toFixed(2), datum:frueher[0].inspection_date};
    if(diff <= -0.5) befunde.push({stufe:"warnung", titel:"Der Zustand hat sich verschlechtert",
      text:`Gegenüber der Begehung vom ${fmtDate(frueher[0].inspection_date)} ist die Note von ${vor.toFixed(1)} auf ${st.score.toFixed(1)} gefallen.`, punkte:[]});
    else if(diff >= 0.5) befunde.push({stufe:"gut", titel:"Der Zustand hat sich verbessert",
      text:`Gegenüber der Begehung vom ${fmtDate(frueher[0].inspection_date)} ist die Note von ${vor.toFixed(1)} auf ${st.score.toFixed(1)} gestiegen.`, punkte:[]});
  }

  /* Gesamturteil */
  let ampel, urteil, empfehlung;
  const zuWenig = aktiv.length > 0 && offen.length > aktiv.length*0.3;
  if(sicherheit.length){
    ampel = "rot";
    urteil = "Handlungsbedarf, sicherheitsrelevante Mängel vorhanden";
    empfehlung = sicherheit.length === 1
      ? "Zuerst den sicherheitsrelevanten Punkt beheben, danach erneut prüfen."
      : `Zuerst die ${sicherheit.length} sicherheitsrelevanten Punkte beheben, danach erneut prüfen.`;
  } else if(zuWenig){
    /* Ein gutes Urteil über eine kaum bearbeitete Begehung wäre irreführend */
    ampel = "gelb";
    urteil = "Für ein Urteil wurde zu wenig geprüft";
    empfehlung = `Erst ${offen.length} von ${aktiv.length} Punkten sind unbearbeitet. Die Begehung sollte vervollständigt werden, bevor eine Aussage möglich ist.`;
  } else if(ausReisser.length || schlecht.length >= 3 || ueberfaellig.length || schadenNotizen.length || (st.score!=null && st.score < 3)){
    ampel = "gelb";
    urteil = "Mängel vorhanden, keine unmittelbare Gefahr";
    empfehlung = "Die aufgeführten Punkte einplanen und mit Fristen versehen.";
  } else if(st.score!=null && st.score >= 4 && !schlecht.length){
    ampel = "gruen";
    urteil = "Objekt in gutem Zustand";
    empfehlung = "Keine dringenden Maßnahmen. Nächste Begehung wie üblich.";
  } else {
    ampel = "gelb";
    urteil = "Zustand durchschnittlich";
    empfehlung = "Einzelne Punkte beobachten und bei der nächsten Begehung erneut ansehen.";
  }
  if(zuWenig && ampel !== "gelb"){
    empfehlung += " Achtung: Ein großer Teil wurde nicht bearbeitet, das Urteil ist entsprechend unsicher.";
  }

  return {ampel, urteil, empfehlung, trend, befunde,
    zahlen:{gesamt:aktiv.length, bearbeitet:st.answered.length, note:st.score!=null?+st.score.toFixed(2):null,
            maengel:st.defects.length, kritisch:sicherheit.length, messwertAusreisser:ausReisser.length,
            notizen:notiz.length, schadensnotizen:schadenNotizen.length}};
}
