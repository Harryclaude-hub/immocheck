    doc.text(`${st.answered.length} von ${aktiveItems(items).length} Prüfpunkten bearbeitet`
      + (items.filter(i=>i.hidden).length ? `, ${items.filter(i=>i.hidden).length} ausgeblendet` : ""), M+42, y+15.5);
    doc.setFont("helvetica","bold"); doc.setFontSize(9);
    doc.text(`Mängel: ${st.defects.length}`, W-M-46, y+9);
    doc.text(`Kritisch: ${st.critical.length}`, W-M-46, y+15.5);
    doc.setTextColor(30,41,59);
    y += 28;

    if(insp.general_notes){
      doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.text("Allgemeine Notizen", M, y); y+=5;
      doc.setFont("helvetica","normal"); doc.setFontSize(9);
      const lines = doc.splitTextToSize(insp.general_notes, W-2*M);
      doc.text(lines, M, y); y += lines.length*4.4 + 4;
    }

    /* Vom Papierbogen übernommene Anmerkungen */
    if(insp.scan_summary){
      if(y > 240){ doc.addPage(); y = 18; }
      doc.setFont("helvetica","bold"); doc.setFontSize(10);
      doc.text("Anmerkungen vom Papierbogen", M, y); y += 5;
      doc.setFont("helvetica","normal"); doc.setFontSize(9);
      const lines = doc.splitTextToSize(insp.scan_summary, W-2*M);
      doc.text(lines, M, y); y += lines.length*4.4 + 4;
    }
    const scanAnzahl = (insp.scan_paths||[]).length;
    if(scanAnzahl){
      doc.setFont("helvetica","italic"); doc.setFontSize(8.5); doc.setTextColor(100,116,139);
      doc.text(`${scanAnzahl} eingescannte Seite${scanAnzahl>1?"n":""} des Papierbogens sind in ImmoCheck hinterlegt.`, M, y);
      doc.setTextColor(30,41,59); y += 6;
    }

    /* Ausgeschlossene Bereiche */
    const ausgeschlossen = Object.entries(IS.skipped || {});
    if(ausgeschlossen.length){
      if(y > 235){ doc.addPage(); y = 18; }
      doc.setFont("helvetica","bold"); doc.setFontSize(11);
      doc.text(`Ausgeschlossene Bereiche (${ausgeschlossen.length})`, M, y);
      doc.autoTable({
        startY: y+3,
        head: [["Bereich","Entfallene Fragen","Begründung"]],
        body: ausgeschlossen.map(([k,grund]) => {
          const c = S.categories.find(x=>x.key===k);
          return [ c ? c.name : k, String(items.filter(i=>i.category_key===k).length), grund || "ohne Angabe" ];
        }),
        styles:{fontSize:8, cellPadding:1.8, overflow:"linebreak"},
        headStyles:{fillColor:[245,158,11], fontSize:8},
        columnStyles:{0:{cellWidth:60},1:{cellWidth:32,halign:"center"},2:{cellWidth:"auto"}}
      });
      y = doc.lastAutoTable.finalY + 8;
    }

    /* Mängelübersicht */
    const maengel = aktiveItems(items).filter(i=>i.defect || i.presence==="nicht_vorhanden" || (i.rating!=null && i.rating<=2));
    if(maengel.length){
      doc.setFont("helvetica","bold"); doc.setFontSize(11);
      doc.text(`Maßnahmen und Auffälligkeiten (${maengel.length})`, M, y);
      doc.autoTable({
        startY: y+3,
        head: [["Prüfpunkt","Kategorie","Status","Bew.","Priorität","Frist"]],
        body: maengel.map(i=>[
          i.criterion_name + (i.note ? "\n" + i.note : ""),
          i.category_name,
          PRES_TXT[i.presence||"offen"],
          i.rating!=null ? i.rating+"/5" : "-",
          i.priority==="keine" ? "-" : i.priority.charAt(0).toUpperCase()+i.priority.slice(1),
          i.due_date ? fmtDate(i.due_date) : "-"
        ]),
        styles:{fontSize:8, cellPadding:1.8, overflow:"linebreak"},
        headStyles:{fillColor:[29,78,216], fontSize:8},
        columnStyles:{0:{cellWidth:62},1:{cellWidth:32},2:{cellWidth:26},3:{cellWidth:12,halign:"center"},4:{cellWidth:20},5:{cellWidth:20}},
        didParseCell: d => {
          if(d.section==="body" && d.column.index===4 && /Kritisch|Hoch/i.test(d.cell.raw)){
            d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = "bold";
          }
          if(d.section==="body" && d.column.index===2 && /NICHT/.test(d.cell.raw)){
            d.cell.styles.textColor = [185,28,28]; d.cell.styles.fontStyle = "bold";
          }
        }
      });
      y = doc.lastAutoTable.finalY + 8;
    }

    /* Detailteil je Kategorie */
    const cats = [...new Set(items.map(i=>i.category_key))].filter(ck => !istUebersprungen(ck));
    for(const ck of cats){
      const alle = items.filter(i=>i.category_key===ck);
      const cItems = alle.filter(i=>!i.hidden);
      const versteckt = alle.filter(i=>i.hidden);
      const cs = itemStats(cItems);
      if(y > 250){ doc.addPage(); y = 18; }
      doc.setFont("helvetica","bold"); doc.setFontSize(11);
      doc.text(`${alle[0].category_name}`, M, y);
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(100,116,139);
      doc.text(cs.score!=null ? `Durchschnitt ${cs.score.toFixed(1)} / 5` : "keine Bewertung", W-M, y, {align:"right"});
      doc.setTextColor(30,41,59);
      doc.autoTable({
        startY: y+3,
        head: [["Prüfpunkt","Status","Bewertung","Notiz"]],
        body: cItems.map(i=>[
          i.criterion_name + (i.critical ? "  [sicherheitsrelevant]" : ""),
          PRES_TXT[i.presence||"offen"],
          i.rating!=null ? `${i.rating}/5 ${RATE_TXT[i.rating]}` : "-",
          i.note || ""
        ]).concat(versteckt.map(i=>[
          i.criterion_name,
          "Ausgeblendet",
          "-",
          i.hidden_reason ? "Nicht relevant: " + i.hidden_reason : "Für dieses Objekt nicht relevant"
        ])),
        styles:{fontSize:8, cellPadding:1.7, overflow:"linebreak"},
        headStyles:{fillColor:[226,232,240], textColor:[51,65,85], fontSize:8},
        alternateRowStyles:{fillColor:[248,250,252]},
        columnStyles:{0:{cellWidth:70},1:{cellWidth:26},2:{cellWidth:32},3:{cellWidth:"auto"}},
        didParseCell: d => {
          if(d.section!=="body") return;
          const it = cItems.concat(versteckt)[d.row.index];
          if(!it) return;
          if(it.hidden){ d.cell.styles.textColor = [148,163,184]; d.cell.styles.fontStyle = "italic"; return; }
          if(d.column.index===1 && it.presence==="nicht_vorhanden"){ d.cell.styles.textColor=[185,28,28]; d.cell.styles.fontStyle="bold"; }
          if(d.column.index===2 && it.rating!=null){
            const c = it.rating>=4?[21,128,61]: it.rating===3?[161,98,7]:[185,28,28];
            d.cell.styles.textColor = c;
          }
        }
      });
      y = doc.lastAutoTable.finalY + 7;
    }

    /* Fotoanhang */
    const withPhoto = items.filter(i=>i.photo_path && IS.photoUrls[i.photo_path]);
    if(withPhoto.length){
      doc.addPage(); y = 18;
      doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.text("Fotodokumentation", M, y); y += 8;
      let x = M; const w = (W-2*M-6)/2; const h = w*0.72;
      for(const i of withPhoto){
        try{
          const dataUrl = await urlToDataUrl(IS.photoUrls[i.photo_path]);
          if(y + h + 12 > 280){ doc.addPage(); y = 18; x = M; }
          doc.addImage(dataUrl, "JPEG", x, y, w, h);
          doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(71,85,105);
          const cap = doc.splitTextToSize(`${i.category_name}: ${i.criterion_name}`, w);
          doc.text(cap.slice(0,2), x, y+h+3.5);
          doc.setTextColor(30,41,59);
          if(x === M){ x = M + w + 6; } else { x = M; y += h + 12; }
        }catch(e){ console.warn("Foto konnte nicht eingebettet werden", e); }
      }
    }

    /* Fußzeile */
    const pages = doc.internal.getNumberOfPages();
    for(let p=1;p<=pages;p++){
      doc.setPage(p);
      doc.setFontSize(7.5); doc.setTextColor(148,163,184);
      doc.text(`${prop.name} · Prüfprotokoll vom ${fmtDate(insp.inspection_date)} · erstellt am ${fmtDateTime(new Date())}`, M, 290);
      doc.text(`Seite ${p} von ${pages}`, W-M, 290, {align:"right"});
    }

    const safe = s => String(s||"objekt").replace(/[^a-zA-Z0-9äöüÄÖÜß_-]+/g,"_").slice(0,40);
    doc.save(`Pruefprotokoll_${safe(prop.name)}_${insp.inspection_date}.pdf`);
    toast("PDF erstellt ✓");
  }catch(err){
    console.error(err);
    toast("PDF-Fehler: "+(err.message||err), 5000);
  }
}
function urlToDataUrl(url){
  return fetch(url).then(r=>r.blob()).then(b => new Promise((res,rej)=>{
    const fr = new FileReader(); fr.onload = ()=>res(fr.result); fr.onerror = rej; fr.readAsDataURL(b);
  }));
}

function tplNeu(basisId){
  const basis = basisId ? S.templates.find(t=>t.id===basisId) : null;
  openModal(`
    <h2>${basis?"Vorlage kopieren":"Eigene Vorlage"}</h2>
    <p class="small muted" style="margin:-8px 0 14px">
      ${basis?`Alle ${tplPunkte(basisId).length} Fragen aus "${esc(basis.name)}" werden übernommen und können danach angepasst werden.`
             :"Startet leer. Im nächsten Schritt wählst du aus, welche Fragen enthalten sein sollen."}
    </p>
    <form onsubmit="return tplSpeichern(event, null, ${basisId?`'${basisId}'`:"null"})">
      <div class="grid g2">
        <div class="field"><label>Symbol</label><input name="icon" value="${basis?esc(basis.icon||"📋"):"📋"}" maxlength="4"></div>
        <div class="field"><label>Sortierung</label><input name="sort_order" type="number" value="200"></div>
      </div>
      <div class="field"><label>Name *</label><input name="name" required value="${basis?esc(basis.name)+" (Kopie)":""}" placeholder="z. B. Kurzcheck Ferienwohnung"></div>
      <div class="field"><label>Beschreibung</label><input name="description" value="${basis?esc(basis.description||""):""}" placeholder="Wofür ist dieser Katalog gedacht?"></div>
      <label>Passt zu diesen Objektarten</label>
      <div class="row" style="gap:8px;margin-bottom:16px">
        ${OBJEKTTYPEN.map(([k,l])=>`<label class="chip-toggle" style="cursor:pointer;margin:0">
          <input type="checkbox" name="ot" value="${k}" style="width:auto" ${basis&&(basis.object_types||[]).includes(k)?"checked":""}> ${l}
        </label>`).join("")}
      </div>
      <div class="row">
        <button type="button" class="btn sec" onclick="closeModal()">Abbrechen</button>
        <div class="spacer"></div>
        <button class="btn" type="submit">Anlegen und Fragen wählen</button>
      </div>
    </form>`);
}
function tplKopieren(id){ tplNeu(id); }

async function tplSpeichern(ev, id, basisId){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const rec = {
    name: fd.get("name"),
    description: fd.get("description") || null,
    icon: fd.get("icon") || "📋",
    object_types: fd.getAll("ot"),
    sort_order: Number(fd.get("sort_order")) || 200
  };
  if(id){
    const {error} = await sb.from("templates").update(rec).eq("id", id);
    if(error){ toast("Fehler: "+error.message,4000); return false; }
    closeModal(); await loadCatalog(); go("templates"); return false;
  }
  rec.is_system = false; rec.created_by = S.user.id;
  const {data, error} = await sb.from("templates").insert(rec).select().single();
  if(error){ toast("Fehler: "+error.message,4000); return false; }

  if(basisId){
    const ids = [...(S.templateCriteria[basisId] || [])];
    for(let i=0;i<ids.length;i+=200){
      await sb.from("template_criteria").insert(ids.slice(i,i+200).map(cid => ({template_id:data.id, criterion_id:cid})));
    }
  }
  closeModal();
  await loadCatalog();
  toast("Vorlage angelegt ✓");
  tplBearbeiten(data.id);
  return false;
}

async function tplLoeschen(id){
  const t = S.templates.find(x=>x.id===id);
  if(!confirm(`Vorlage "${t.name}" löschen? Bereits durchgeführte Begehungen bleiben unverändert.`)) return;
  const {error} = await sb.from("templates").delete().eq("id",id);
  if(error){ toast("Fehler: "+error.message,4000); return; }
  await loadCatalog(); go("templates"); toast("Vorlage gelöscht");
}

function tplBearbeiten(id){
  const t = S.templates.find(x=>x.id===id);
  const drin = new Set(S.templateCriteria[id] || []);
  const darfBearbeiten = !t.is_system || S.profile?.role === "admin";

  const block = cat => {
    const list = S.criteria.filter(c=>c.category_id===cat.id);
    if(!list.length) return "";
    const anzahl = list.filter(c=>drin.has(c.id)).length;
    return `<div class="cat" id="tplcat-${cat.key}">
      <div class="cat-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="ico">${cat.icon}</span>
        <span class="t">${esc(cat.name)}</span>
        <span class="badge ${anzahl?"brand":""}" id="tplcnt-${cat.key}">${anzahl}/${list.length}</span>
        <span class="muted">▾</span>
      </div>
      <div class="cat-body">
        <div style="padding:8px 14px;border-bottom:1px solid #f1f5f9" class="row">
          <button type="button" class="btn sec sm" onclick="tplAlle('${cat.key}',true)">Alle</button>
          <button type="button" class="btn sec sm" onclick="tplAlle('${cat.key}',false)">Keine</button>
          <button type="button" class="btn sec sm" onclick="tplKritische('${cat.key}')">Nur sicherheitsrelevante</button>
        </div>
        ${list.map(c=>`<label class="crit" style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:10px 14px">
          <input type="checkbox" data-cat="${cat.key}" value="${c.id}" style="width:auto;margin-top:3px" ${drin.has(c.id)?"checked":""} onchange="tplZaehle('${cat.key}')">
          <span style="flex:1">
            <span style="font-weight:600">${esc(c.name)}</span>
            ${c.critical?'<span class="badge bad xs">sicherheitsrelevant</span>':""}
            ${c.hint?`<span class="crit-hint" style="display:block;margin:2px 0 0">${esc(c.hint)}</span>`:""}
          </span>
        </label>`).join("")}
      </div>
    </div>`;
  };

  openModal(`
    <h2>${esc(t.name)}</h2>
    <p class="small muted" style="margin:-8px 0 12px">
      Wähle aus, welche Fragen dieser Katalog enthält.
      ${t.is_system && !darfBearbeiten ? "Standard-Kataloge kann nur der Administrator ändern. Du kannst stattdessen eine Kopie anlegen." : ""}
    </p>
    <div class="row" style="margin-bottom:10px">
      <span class="badge brand" id="tpl-summe">–</span>
      <div class="spacer"></div>
      <button type="button" class="btn ghost sm" onclick="document.querySelectorAll('#tpl-form .cat').forEach(c=>c.classList.add('open'))">Alle aufklappen</button>
    </div>
    <div id="tpl-form" style="max-height:52dvh;overflow:auto;margin-bottom:14px">
      ${S.categories.map(block).join("")}
    </div>
    <div class="row">
      <button type="button" class="btn sec" onclick="closeModal()">Abbrechen</button>
      <div class="spacer"></div>
      ${darfBearbeiten?`<button class="btn" onclick="tplFragenSpeichern('${id}')">Speichern</button>`:`<button class="btn" onclick="closeModal();tplKopieren('${id}')">Als eigene Kopie anlegen</button>`}
    </div>`);
  tplSumme();
}
function tplZaehle(catKey){
  const boxen = document.querySelectorAll(`#tpl-form input[data-cat="${catKey}"]`);
  const an = [...boxen].filter(b=>b.checked).length;
  const badge = el("tplcnt-"+catKey);
  if(badge){ badge.textContent = `${an}/${boxen.length}`; badge.className = "badge" + (an?" brand":""); }
  tplSumme();
}
function tplSumme(){
  const alle = document.querySelectorAll("#tpl-form input[type=checkbox]");
  const an = [...alle].filter(b=>b.checked).length;
  const s = el("tpl-summe");
  if(s) s.textContent = `${an} von ${alle.length} Fragen ausgewählt`;
}
function tplAlle(catKey, an){
  document.querySelectorAll(`#tpl-form input[data-cat="${catKey}"]`).forEach(b=>b.checked = an);
  tplZaehle(catKey);
}
function tplKritische(catKey){
  document.querySelectorAll(`#tpl-form input[data-cat="${catKey}"]`).forEach(b=>{
    const c = S.criteria.find(x=>x.id===b.value);
    b.checked = !!(c && c.critical);
  });
  tplZaehle(catKey);
}
async function tplFragenSpeichern(id){
  const gewaehlt = [...document.querySelectorAll("#tpl-form input[type=checkbox]")].filter(b=>b.checked).map(b=>b.value);
  if(!gewaehlt.length && !confirm("Der Katalog enthält keine einzige Frage. Trotzdem speichern?")) return;
  await sb.from("template_criteria").delete().eq("template_id", id);
  for(let i=0;i<gewaehlt.length;i+=200){
    const {error} = await sb.from("template_criteria").insert(gewaehlt.slice(i,i+200).map(cid=>({template_id:id, criterion_id:cid})));
    if(error){ toast("Fehler: "+error.message,4000); return; }
  }
  closeModal();
  await loadCatalog();
  go("templates");
  toast(`Gespeichert: ${gewaehlt.length} Fragen ✓`);
}

            ${isAdmin?`<button class="btn ghost sm" onclick="toggleCategory('${cat.id}',${!cat.active})">${cat.active?"Deaktivieren":"Aktivieren"}</button>`:""}
          </div>
          <table class="t" style="margin:0">
            <tbody>
            ${list.map(c=>`<tr style="${c.active?"":"opacity:.5"}">
              <td style="width:52%"><strong>${esc(c.name)}</strong>${c.hint?`<div class="xs muted">${esc(c.hint)}</div>`:""}</td>
              <td>${c.critical?'<span class="badge bad">sicherheitsrelevant</span>':""}</td>
              <td class="xs">${c.scope==="beide"?"universell":c.scope==="gebaeude"?"Gebäude":"Einheit"}</td>
              <td>${c.is_system?'<span class="xs muted">Standard</span>':'<span class="badge info">eigen</span>'}</td>
              <td style="text-align:right;white-space:nowrap">
                ${(isAdmin||c.created_by===S.user.id)?`<button class="btn ghost sm" onclick="editCriterion('${c.id}')">✎</button>
                <button class="btn ghost sm" onclick="toggleCriterion('${c.id}',${!c.active})">${c.active?"🚫":"↺"}</button>`:""}
              </td>
            </tr>`).join("") || '<tr><td class="xs muted" style="padding:12px">Noch keine Prüfpunkte in dieser Kategorie.</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>`;
    }).join("")}
  `;
}
function editCategory(id){
  const c = id ? S.categories.find(x=>x.id===id) : null;
  openModal(`
    <h2>${id?"Kategorie bearbeiten":"Neue Kategorie"}</h2>
    <form onsubmit="return saveCategory(event,${id?`'${id}'`:"null"})">
      <div class="grid g2">
        <div class="field"><label>Symbol</label><input name="icon" value="${esc(c?.icon||"📋")}" maxlength="4"></div>
        <div class="field"><label>Sortierung</label><input name="sort_order" type="number" value="${c?.sort_order??999}"></div>
      </div>
      <div class="field"><label>Name *</label><input name="name" required value="${esc(c?.name||"")}"></div>
      <div class="field"><label>Gilt für</label><select name="scope">
        <option value="beide" ${c?.scope==="beide"?"selected":""}>Universell (Gebäude und Einheit)</option>
        <option value="gebaeude" ${c?.scope==="gebaeude"?"selected":""}>Nur Gebäude / Allgemeinbereiche</option>
        <option value="einheit" ${c?.scope==="einheit"?"selected":""}>Nur Wohnung / Einheit</option>
      </select></div>
      <div class="row"><button type="button" class="btn sec" onclick="closeModal()">Abbrechen</button><div class="spacer"></div><button class="btn" type="submit">Speichern</button></div>
    </form>`);
}
async function saveCategory(ev, id){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const rec = {name:fd.get("name"), icon:fd.get("icon")||"📋", scope:fd.get("scope"), sort_order:Number(fd.get("sort_order"))||999};
  let error;
  if(id){ ({error} = await sb.from("categories").update(rec).eq("id",id)); }
  else {
    rec.key = rec.name.toLowerCase().replace(/[^a-z0-9]+/g,"_").slice(0,30) + "_" + Math.random().toString(36).slice(2,6);
    rec.is_system = false; rec.created_by = S.user.id;
    ({error} = await sb.from("categories").insert(rec));
  }
  if(error){ toast("Fehler: "+error.message,4000); return false; }
  closeModal(); toast("Gespeichert ✓"); go("catalog"); return false;
}
async function toggleCategory(id, active){
  const {error} = await sb.from("categories").update({active}).eq("id",id);
  if(error) return toast("Fehler: "+error.message,4000);
  go("catalog");
}
function editCriterion(id, catId){
  const c = id ? S.criteria.find(x=>x.id===id) : null;
  openModal(`
    <h2>${id?"Prüfpunkt bearbeiten":"Neuer Prüfpunkt"}</h2>
    <form onsubmit="return saveCriterion(event,${id?`'${id}'`:"null"})">
      <div class="field"><label>Kategorie *</label><select name="category_id">
        ${S.categories.map(k=>`<option value="${k.id}" ${(c?.category_id||catId)===k.id?"selected":""}>${k.icon} ${esc(k.name)}</option>`).join("")}
      </select></div>
      <div class="field"><label>Bezeichnung *</label><input name="name" required value="${esc(c?.name||"")}" placeholder="z. B. Rauchwarnmelder funktionsfähig"></div>
      <div class="field"><label>Hinweis für den Prüfer</label><input name="hint" value="${esc(c?.hint||"")}" placeholder="Worauf ist zu achten?"></div>
      <div class="grid g2">
        <div class="field"><label>Gilt für</label><select name="scope">
          <option value="beide" ${(c?.scope||"beide")==="beide"?"selected":""}>Universell</option>
          <option value="gebaeude" ${c?.scope==="gebaeude"?"selected":""}>Nur Gebäude</option>
          <option value="einheit" ${c?.scope==="einheit"?"selected":""}>Nur Einheit</option>
        </select></div>
        <div class="field"><label>Sortierung</label><input name="sort_order" type="number" value="${c?.sort_order??999}"></div>
      </div>
      <label class="row xs" style="gap:7px;margin-bottom:14px"><input type="checkbox" name="critical" style="width:auto" ${c?.critical?"checked":""}> Sicherheitsrelevanter Punkt</label>
      <div class="row"><button type="button" class="btn sec" onclick="closeModal()">Abbrechen</button><div class="spacer"></div><button class="btn" type="submit">Speichern</button></div>
    </form>`);
}
async function saveCriterion(ev, id){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const rec = {category_id:fd.get("category_id"), name:fd.get("name"), hint:fd.get("hint")||null,
    scope:fd.get("scope"), critical:!!fd.get("critical"), sort_order:Number(fd.get("sort_order"))||999};
  let error;
  if(id){ ({error} = await sb.from("criteria").update(rec).eq("id",id)); }
  else { rec.is_system = false; rec.created_by = S.user.id; ({error} = await sb.from("criteria").insert(rec)); }
  if(error){ toast("Fehler: "+error.message,4000); return false; }
  closeModal(); toast("Gespeichert ✓"); go("catalog"); return false;
}
async function toggleCriterion(id, active){
  const {error} = await sb.from("criteria").update({active}).eq("id",id);
  if(error) return toast("Fehler: "+error.message,4000);
  go("catalog");
}

/* =========================================================

  const rest = S.profiles.filter(p=>p.status!=="wartend");
  const statusBadge = s => s==="aktiv" ? '<span class="badge ok">aktiv</span>'
    : s==="wartend" ? '<span class="badge warn">wartet auf Freigabe</span>'

    <h1>Team</h1>

    ${wartend.length ? `<div class="card" style="border-color:#fcd34d;background:#fffdf5">

          <strong>${esc(p.full_name||"Ohne Namen")}</strong>
          <div class="xs muted">${esc(p.email)} · registriert am ${fmtDate(p.created_at)}</div>

      <h3>Alle Konten</h3>

        </td></tr>`).join("")}

async function setRole(id, role){
  const {error} = await sb.from("profiles").update({role}).eq("id",id);
  if(error) return toast("Fehler: "+error.message,4000);
  toast("Rolle geändert ✓"); go("team");
}
async function setStatus(id, status){
  const {error} = await sb.from("profiles").update({status}).eq("id",id);
  if(error) return toast("Fehler: "+error.message,4000);
  toast(status==="aktiv"?"Zugang freigegeben ✓":status==="gesperrt"?"Zugang gesperrt":"Status geändert"); go("team");
}

async function saveProfile(ev){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const rec = {full_name:fd.get("full_name")||null, company:fd.get("company")||null, phone:fd.get("phone")||null};

  Object.assign(S.profile, rec);
  el("u-name").textContent = rec.full_name || S.user.email;
  el("u-initials").textContent = initials(rec.full_name, S.user.email);
  toast("Gespeichert ✓"); return false;

async function changePw(ev){
  ev.preventDefault();
  const pw = new FormData(ev.target).get("pw");
  const {error} = await sb.auth.updateUser({password:pw});
  if(error){ toast("Fehler: "+error.message,4000); return false; }
  ev.target.reset(); toast("Passwort geändert ✓"); return false;
}

    <div class="auth-card" style="max-width:520px">

      <div class="note">

      </div>

      <details style="margin-bottom:14px">

        <ol class="small muted" style="padding-left:18px;margin:10px 0 0;line-height:1.7">
          <li>Auf <a href="https://supabase.com" target="_blank" rel="noopener">supabase.com</a> kostenlos registrieren und ein neues Projekt anlegen (Region Frankfurt).</li>
          <li>Im Projekt links auf <strong>SQL Editor</strong>, den Inhalt der Datei <code>setup.sql</code> einfügen und ausführen. Das legt alle Tabellen und die 179 Prüfpunkte an.</li>
          <li>Unter <strong>Project Settings → API</strong> findest du die <strong>Project URL</strong> und den <strong>anon public</strong> Schlüssel. Beides hier eintragen.</li>
          <li>Unter <strong>Authentication → Providers → Email</strong> die Option <em>Confirm email</em> ausschalten.</li>
        </ol>
      </details>

      <div id="setup-err" class="err hidden"></div>

      <form onsubmit="return speichereVerbindung(event)">
        <div class="field">
          <label>Project URL</label>
          <input name="url" required placeholder="https://xxxxxxxx.supabase.co" value="${esc(c.url)}">
        </div>
        <div class="field">

          <textarea name="key" required placeholder="eyJhbGciOi..." style="min-height:80px;font-size:12px;font-family:ui-monospace,monospace">${esc(c.key)}</textarea>
        </div>
        <button class="btn full" id="setup-btn" type="submit">Verbinden und prüfen</button>
        ${CONF ? '<button type="button" class="btn sec full" style="margin-top:9px" onclick="location.reload()">Abbrechen</button>' : ""}
      </form>
      <p class="xs muted" style="text-align:center;margin:14px 0 0">
        Die Zugangsdaten bleiben nur in diesem Browser gespeichert.
      </p>
    </div>`;
}

async function speichereVerbindung(ev){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const url = String(fd.get("url")).trim().replace(/\/+$/, "");
  const key = String(fd.get("key")).trim();
  const btn = el("setup-btn"); const alt = btn.innerHTML;
  btn.innerHTML = '<div class="loader"></div>'; btn.disabled = true;
  const fehler = m => { const e = el("setup-err"); e.innerHTML = m; e.classList.remove("hidden"); };
  el("setup-err").classList.add("hidden");
  try{
    if(!/^https:\/\/.+\.supabase\.co$/.test(url) && !/^https?:\/\//.test(url))
      throw new Error("Die Project URL sieht nicht richtig aus. Sie hat die Form https://xxxxxxxx.supabase.co");
    const r = await fetch(`${url}/rest/v1/categories?select=key&limit=1`, {
      headers: { apikey: key, Authorization: "Bearer " + key }
    });
    if(r.status === 401 || r.status === 403) throw new Error("Der Schlüssel wird nicht akzeptiert. Bitte den <strong>anon public</strong> Schlüssel verwenden.");
    if(r.status === 404) throw new Error("Verbindung steht, aber die Tabellen fehlen. Bitte zuerst <code>setup.sql</code> im SQL Editor ausführen.");
    if(!r.ok) throw new Error("Antwort vom Server: " + r.status + ". Bitte URL und Schlüssel prüfen.");
    localStorage.setItem(CONF_STORE, JSON.stringify({url, key}));
    location.reload();
  }catch(err){
    fehler(err.message && err.message.includes("Failed to fetch")
      ? "Keine Verbindung zu dieser Adresse. Stimmt die Project URL?"
      : (err.message || String(err)));
    btn.innerHTML = alt; btn.disabled = false;
  }
  return false;
}

function verbindungTrennen(){
  if(!confirm("Verbindung zu dieser Datenbank in diesem Browser lösen? Deine Daten bleiben in der Datenbank erhalten.")) return;
  localStorage.removeItem(CONF_STORE);
  location.reload();
}
